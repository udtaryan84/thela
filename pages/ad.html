* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--sans); display: flex; flex-direction: column; }

video { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: #0F0D0B; border: 1px solid var(--line); display: block; }
p { margin: 0; color: var(--ink-2); }
.cta { display: inline-block; margin-top: 4px; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 550; }
