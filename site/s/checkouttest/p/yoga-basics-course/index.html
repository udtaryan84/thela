<style>
/* A creator's store. Built by scripts/build.ps1 from stores/_template.html and stores/<name>.json. */
:root {
  --bg: #FFFFFF; --surface: #F7F7F7; --card: #FFFFFF; --ink: #222222; --body: #3F3F3F; --muted: #6A6A6A;
  --line: #DDDDDD; --accent: #C2410C; --accent-ink: #FFFFFF; --accent-soft: #FDEEE6; --ok: #1E7B4F; --err: #B42318;
  --shadow: 0 6px 16px rgba(0,0,0,.08);
  --sans: "Plus Jakarta Sans", "Noto Sans Devanagari", "Segoe UI", system-ui, -apple-system, sans-serif;
  --brand: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1C1C1C; --card: #1C1C1C; --ink: #F2F2F2; --body: #D0D0D0; --muted: #9A9A9A;
    --line: #2E2E2E; --accent: #FB8A4C; --accent-ink: #1A0F08; --accent-soft: #2A1A10; --ok: #4CC38A; --err: #F87171;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1C1C1C; --card: #1C1C1C; --ink: #F2F2F2; --body: #D0D0D0; --muted: #9A9A9A;
  --line: #2E2E2E; --accent: #FB8A4C; --accent-ink: #1A0F08; --accent-soft: #2A1A10; --ok: #4CC38A; --err: #F87171;
  --shadow: none; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--body); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, p, ul { margin: 0; }
h1, h2 { color: var(--ink); }
ul { padding: 0; list-style: none; }
a { color: inherit; text-underline-offset: .2em; }
button { font: inherit; color: inherit; cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
[hidden] { display: none !important; }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.page { max-width: 480px; margin-inline: auto; padding: 20px 16px 48px; display: grid; gap: 28px; }
.banner { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 500; text-align: center; }

/* Creator header, like a host profile */
.host { display: grid; gap: 14px; padding-top: 8px; }
.host-row { display: flex; align-items: center; gap: 16px; }
.avatar { width: 72px; height: 72px; flex: none; border-radius: 50%; object-fit: cover; background: var(--surface); border: 1px solid var(--line); }
.avatar-initials { display: grid; place-items: center; color: var(--ink); font-weight: 600; font-size: 24px; }
.name { font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
.place { display: flex; align-items: center; gap: 4px; margin-top: 2px; color: var(--muted); font-size: 14px; }
.place .i { width: 16px; height: 16px; }
.bio { color: var(--body); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none; transition: border-color .15s; }
.links a:hover { border-color: var(--ink); }

/* Product cards, like listing cards */
.products { display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.card-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--surface); }
.card-body { display: grid; gap: 16px; padding: 16px; }
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.kind { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.p-title { font-size: 17px; font-weight: 600; line-height: 1.3; }
.p-meta { margin-top: 2px; font-size: 14px; color: var(--muted); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.price { color: var(--ink); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.price span { font-size: 14px; font-weight: 400; color: var(--muted); }
.buy { border: 0; border-radius: 12px; min-height: 48px; min-width: 104px; padding: 10px 20px; font-weight: 600; background: var(--accent); color: var(--accent-ink); white-space: nowrap; transition: filter .15s; }
.buy:hover, .btn-primary:hover { filter: brightness(.94); }

/* Reviews (only when the store has them) */
.section-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
.reviews { display: grid; gap: 12px; }
.review { border-top: 1px solid var(--line); padding-top: 12px; }
.review b { display: block; color: var(--ink); font-weight: 600; font-size: 15px; }
.review p { font-size: 15px; }

/* Good to know */
.facts { display: grid; }
.fact { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; }
.fact .i { margin-top: 2px; color: var(--ink); }
.fact b { display: block; color: var(--ink); font-weight: 600; }
.fact a { color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; }
.footer { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; column-gap: 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.footer a { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; }
.mark { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); text-decoration: none; }
.word { font-family: var(--brand); font-weight: 800; font-size: 17px; letter-spacing: -0.02em; color: var(--ink); }

/* Checkout sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .5); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 92vh; overflow-y: auto; background: var(--card); color: var(--body); border-radius: 20px 20px 0 0; padding: 12px 20px calc(32px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
.sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 16px; }
.scrim:not([hidden]) { animation: fade .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 560px) { .sheet { left: 50%; right: auto; width: 480px; margin-left: -240px; bottom: 24px; border-radius: 20px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
.sheet-title { font-size: 17px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.amount { font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.close { display: grid; place-items: center; border: 0; background: var(--surface); border-radius: 50%; width: 44px; height: 44px; flex: none; color: var(--ink); }
.step { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--ink); }
.field input { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: 500 16px var(--sans); padding: 10px 14px; transition: border-color .15s; }
.field input:focus { border-color: var(--ink); outline: none; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 14px; color: var(--body); align-items: start; min-height: 44px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 10px 20px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 16px; text-decoration: none; text-align: center; transition: filter .15s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:disabled { opacity: .7; }
.btn-secondary { background: var(--card); border-color: var(--ink); color: var(--ink); }
.err { color: var(--err); font-size: 14px; }
.err:empty { display: none; }
.assure { display: flex; gap: 8px; align-items: flex-start; justify-content: center; font-size: 13px; color: var(--muted); text-align: left; }
.assure .i { width: 18px; height: 18px; color: var(--ok); }
.payee { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.payee .i { color: var(--ok); margin-top: 1px; }
.payee b { color: var(--ink); font-weight: 700; }
.qr { display: grid; justify-items: center; gap: 10px; }
.qr-box { width: 200px; max-width: 64vw; background: #FFFFFF; padding: 10px; border-radius: 16px; border: 1px solid var(--line); }
.qr-box svg { display: block; width: 100%; height: auto; }
.small { font-size: 13px; color: var(--muted); text-align: center; }
.small a { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); }
.row span { font-size: 13px; color: var(--muted); display: block; }
.row b { font-weight: 600; color: var(--ink); word-break: break-all; }
.code { font-family: var(--mono); font-size: 18px; letter-spacing: .06em; }
.copy { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; min-height: 44px; padding: 6px 16px; font-size: 14px; font-weight: 600; text-decoration: none; }
.apps { display: grid; gap: 8px; }
.apps-label { font-weight: 600; color: var(--ink); }
.apps-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.apps-row .btn { min-height: 52px; padding-inline: 12px; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 44px; font-size: 14px; }
.or { text-align: center; font-size: 13px; color: var(--muted); }
.done { text-align: center; justify-items: center; }
.tick { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ok); }
.tick .i { width: 28px; height: 28px; stroke-width: 2.25; }
.done #done-text { color: var(--ink); }

/* Store cards link to their product page */
.card-link { color: inherit; text-decoration: none; display: block; }
.card-link:hover .p-title { text-decoration: underline; }
.more { font-size: 14px; font-weight: 600; color: var(--accent); }

/* Product page, like a Stan product page */
.is-product .page { padding-bottom: 120px; }
.back { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; }
.back .avatar { width: 36px; height: 36px; font-size: 14px; }
.hero-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.hero-tile { aspect-ratio: 4 / 3; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; align-content: end; gap: 10px; padding: 22px; overflow: hidden; }
.hero-tile .i { width: 40px; height: 40px; }
.hero-tile b { font: 800 clamp(1.8rem, 9vw, 2.6rem)/1 var(--brand); letter-spacing: -0.02em; }
.p-head { display: grid; gap: 8px; }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13px; font-weight: 600; }
.chip .i { width: 16px; height: 16px; }
.p-name { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
.p-price { color: var(--ink); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.p-price span { font-size: 15px; font-weight: 400; color: var(--muted); }
.copy-block { display: grid; gap: 14px; color: var(--body); font-size: 16px; }
.gets { display: grid; gap: 10px; }
.gets li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.gets .i { color: var(--ok); margin-top: 2px; }
.buybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.buybar-in { max-width: 480px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.buybar small { display: block; color: var(--muted); font-size: 12.5px; }
.buybar .buy { min-width: 150px; }

/* Get your own store (every store recruits the next coach) */
.own { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 16px; color: var(--ink); text-decoration: none; }
.own svg { width: 30px; height: 30px; color: var(--accent); }
.own b { display: block; font-weight: 700; }
.own span { font-size: 14px; color: var(--muted); }

      rv.map(function (r) { return '<li class="review"><b>' + esc(r.name) + '</b><p>' + esc(r.text) + '</p></li>'; }).join('') + '</ul></section>' : '';
  }
  // Every store ends with a small card that brings the next coach to Thela (with this store as the referrer).
  var own = '<a class="own" href="https://thela.site/?ref=' + encodeURIComponent(STORE.slug) + '#apply">' +
    '<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M26 6h12v32q0 6 6 6h9v10H42Q26 54 26 38z"/><rect fill="currentColor" x="6" y="19" width="42" height="10" rx="5"/></svg>' +
    '<div><b>' + esc(t.ownTitle) + '</b><span>' + esc(t.ownText) + '</span></div></a>';
  if (STORE.demo) html += '<p class="banner">' + esc(t.demo) + '</p>';
  if (STORE.test) html += '<p class="banner">' + esc(t.test) + '</p>';
  var P = PRODUCT >= 0 ? STORE.products[PRODUCT] : null;
  if (P) {
    // Product page: image or a big title tile, the pitch, what you get, proof, then a sticky buy bar.
    document.documentElement.classList.add('is-product');
    var k = kind(P);
    html += '<a class="back" href="' + storeUrl + '">' + avatar + '<span>' + esc(fill(t.backTo, { name: STORE.name })) + '</span></a>' +
      (P.image ? '<img class="hero-img" src="' + esc(P.image) + '" alt="" width="480" height="360">' : '<div class="hero-tile" aria-hidden="true">' + icon(k === 'plan' || k === 'call' || k === 'course' ? k : 'file') + '<b>' + esc(kindLabel(k)) + '</b></div>') +
      '<header class="p-head"><span class="chip">' + icon(k === 'plan' || k === 'call' || k === 'course' ? k : 'file') + esc(kindLabel(k)) + '</span>' +
      '<h1 class="p-name">' + esc(P.title) + '</h1>' + (P.meta ? '<p class="p-meta">' + esc(P.meta) + '</p>' : '') +
      '<p class="p-price">' + priceHtml(P) + '</p></header>';
    var paras = String(P.description || '').split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (paras.length) html += '<div class="copy-block">' + paras.map(function (s) { return '<p>' + esc(s) + '</p>'; }).join('') + '</div>';
    if (Array.isArray(P.bullets) && P.bullets.length) html += '<section aria-labelledby="gets"><h2 class="section-title" id="gets">' + esc(t.gets) + '</h2><ul class="gets">' +
      P.bullets.map(function (b) { return '<li>' + icon('check') + '<span>' + esc(b) + '</span></li>'; }).join('') + '</ul></section>';
    html += reviewsHtml(P.testimonials, 'rvp');
  } else {
    html += '<header class="host"><div class="host-row">' + avatar +
      '<div><h1 class="name">' + esc(STORE.name) + '</h1>' + (STORE.city ? '<p class="place">' + icon('pin') + esc(STORE.city) + '</p>' : '') + '</div></div>' +
      (STORE.bio ? '<p class="bio">' + esc(STORE.bio) + '</p>' : '');
    var links = (STORE.links || []).map(function (l) { return '<a href="' + esc(l.url) + '" rel="noopener">' + esc(l.label) + '</a>'; }).join('');
    if (links) html += '<nav class="links" aria-label="Links">' + links + '</nav>';
    html += '</header><ul class="products">';
    STORE.products.forEach(function (p, i) {
      var k = kind(p), word = buyWord(p);
      html += '<li class="card"><a class="card-link" href="' + productUrl(p) + '">' + (p.image ? '<img class="card-img" src="' + esc(p.image) + '" alt="" width="448" height="252" loading="lazy">' : '') +
        '<div class="card-body"><div class="card-top">' + (p.image ? '' : '<span class="kind">' + icon(k === 'plan' || k === 'call' || k === 'course' ? k : 'file') + '</span>') +
        '<div><h2 class="p-title">' + esc(p.title) + '</h2>' + (p.meta ? '<p class="p-meta">' + esc(p.meta) + '</p>' : '') + '</div></div></div></a>' +
        '<div class="card-body" style="padding-top:0"><div class="card-foot"><p class="price">' + priceHtml(p) + '</p>' +
        '<button class="buy" data-i="' + i + '" aria-label="' + esc(word + ': ' + p.title + ', ' + rupees(p.price)) + '">' + esc(word) + '</button></div></div></li>';
    });
    html += '</ul>' + reviewsHtml(STORE.reviews, 'rv');
  }
  var contact = (STORE.whatsapp && !STORE.demo ? '<a href="https://wa.me/' + esc(STORE.whatsapp) + '">WhatsApp +' + esc(STORE.whatsapp.slice(0, 2) + ' ' + STORE.whatsapp.slice(2, 7) + ' ' + STORE.whatsapp.slice(7)) + '</a>' : '') +
    (STORE.email && !STORE.demo ? ' <a href="mailto:' + esc(STORE.email) + '">' + esc(STORE.email) + '</a>' : '');
  function fact(ic, label, body) { return '<li class="fact">' + icon(ic) + '<div><b>' + esc(label) + '</b>' + body + '</div></li>'; }
  html += '<section aria-labelledby="gtk"><h2 class="section-title" id="gtk">' + esc(t.goodToKnow) + '</h2><ul class="facts">' +
    fact('clock', t.delivery, esc(CO ? t.coDelivery : fill(t.deliveryLine, { delivery: STORE.delivery }))) +
    fact('refund', t.refunds, esc(STORE.refund)) +
    fact('wallet', t.paymentsLabel, esc(CO ? fill(t.coPayments, { name: first }) : fill(t.payments, { payee: STORE.upi.payee, name: first }))) +
    fact('user', t.soldBy, esc(STORE.name + ', ' + STORE.city) + (contact ? '<br>' + contact : '')) +
    fact('chat', t.help, '<a href="' + esc(report()) + '" rel="noopener">' + esc(t.helpLink) + '</a>') +
    '</ul></section>' + own +
    '<footer class="footer"><a class="mark" href="/" aria-label="' + esc(t.madeWith) + ' Thela"><span>' + esc(t.madeWith) + '</span>' +
    '<svg viewBox="0 0 64 64" width="20" height="20" aria-hidden="true" style="color:var(--accent)"><path fill="currentColor" d="M26 6h12v32q0 6 6 6h9v10H42Q26 54 26 38z"/><rect fill="currentColor" x="6" y="19" width="42" height="10" rx="5"/></svg><span class="word">thela</span></a>' +
    '<span aria-hidden="true">&middot;</span><a href="/about.html#privacy">' + esc(t.privacy) + '</a><span aria-hidden="true">&middot;</span>' +
    '<a href="mailto:' + esc(SITE.email) + '?subject=' + encodeURIComponent('Report: ' + STORE.slug) + '">' + esc(t.report) + '</a></footer>';
  if (P) {
    // Sticky buy bar: price and the buy button stay in reach while the buyer reads.
    html += '<div class="buybar"><div class="buybar-in"><div><p class="price">' + priceHtml(P) + '</p><small>' + esc(CO ? t.payCo : t.payUpi) + '</small></div>' +
      '<button class="buy" data-i="' + PRODUCT + '" aria-label="' + esc(buyWord(P) + ': ' + P.title + ', ' + rupees(P.price)) + '">' + esc(buyWord(P)) + '</button></div></div>';
  }
  $('page').innerHTML = html;

  // Static labels in the sheet
  $('close').setAttribute('aria-label', t.close);
  $('l-name').textContent = t.name; $('l-email').textContent = t.email; $('l-age').textContent = t.age;
  $('l-phone').textContent = t.phone; $('phone-field').hidden = !CO;
  $('assure').hidden = !CO; $('assure-text').textContent = fill(t.assureCo, { name: first });
  $('to-pay').textContent = t.next; $('save-qr').textContent = t.saveQr;
  $('or').textContent = t.or; $('l-code').textContent = t.code;
  $('cancel-order').textContent = t.cancel; $('copy-upi').textContent = t.copy; $('copy-code').textContent = t.copy; $('paid').textContent = t.paid;

  // Orders survive a reload (Instagram's browser often reloads after switching apps).
  var opener = null;
  var KEY = 'thela-order-' + STORE.slug, order = null;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(order)); } catch (e) {} }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY));
      if (o && Date.now() - (o.at || 0) > 864e5) { forget(); return null; }  // saved orders expire after 24 hours
      return o;
    } catch (e) { return null; }
  }
  function forget() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function newCode() {
    var abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = (STORE.prefix || 'TH').toUpperCase().slice(0, 2);
    for (var i = 0; i < 4; i++) s += abc[Math.floor(Math.random() * abc.length)];
    return s;
  }
  function upiQuery(o, noAmount) {
    var p = STORE.products[o.i];
    var note = (o.code + ' ' + p.title).slice(0, 40);
    // The UPI ID goes in as is: some UPI apps fail on an encoded @ (%40). build.ps1 only allows letters, digits, . _ - and one @.
    // Business (merchant) UPI IDs: "mc" is the merchant category code from the creator's business QR; "tr" carries the order code.
    var biz = STORE.upi.mc ? '&mc=' + STORE.upi.mc + '&tr=' + o.code : '';
    return 'pa=' + STORE.upi.id + '&pn=' + encodeURIComponent(STORE.upi.payee) + biz +
      (noAmount ? '' : '&am=' + p.price.toFixed(2)) + '&cu=INR&tn=' + encodeURIComponent(note);
  }
  function upiLink(o) { return 'upi://pay?' + upiQuery(o); }
  // One button per app, so the buyer's phone default (often WhatsApp) does not decide which app opens.
  // Android: intent links that name the app. iPhone: each app's own link. Other: the plain UPI link.
  var APPS = [
    { name: 'Google Pay', pkg: 'com.google.android.apps.nbu.paisa.user', ios: 'gpay://upi/pay?' },
    { name: 'PhonePe', pkg: 'com.phonepe.app', ios: 'phonepe://pay?' },
    { name: 'Paytm', pkg: 'net.one97.paytm', ios: 'paytmmp://pay?' }
  ];
  var ua = navigator.userAgent, isAndroid = /android/i.test(ua), isIOS = /iphone|ipad|ipod/i.test(ua);
  function appLink(a, o, noAmount) {
    var q = upiQuery(o, noAmount);
    if (isAndroid) return 'intent://pay?' + q + '#Intent;scheme=upi;package=' + a.pkg + ';end';
    if (isIOS) return a.ios + q;
    return 'upi://pay?' + q;
  }
  function show(step) { ['step-1', 'step-2', 'step-3'].forEach(function (s, n) { $(s).hidden = n + 1 !== step; }); }
  function open(o) {
    order = o;
    var p = STORE.products[o.i];
    $('sheet-title').textContent = p.title;
    $('sheet-amount').textContent = rupees(p.price) + (p.monthly ? ' ' + t.perMonth : '');
    if (!opener) opener = document.activeElement;
    $('scrim').hidden = false; $('sheet').hidden = false; $('page').inert = true; document.body.style.overflow = 'hidden';
    if (o.step >= 2 && !CO) toPay(); else { show(1); $('b-name').value = o.buyer || ''; $('b-email').value = o.email || ''; $('b-phone').value = o.phone || ''; $('b-age').checked = false; $('err').textContent = ''; resetPay(); $('b-name').focus({ preventScroll: true }); }
  }
  function closeSheet() {
    $('scrim').hidden = true; $('sheet').hidden = true; $('page').inert = false; document.body.style.overflow = '';
    if (opener && opener.focus) opener.focus({ preventScroll: true });
    opener = null;
  }
  function toPay() {
    var p = STORE.products[order.i], amt = rupees(p.price);
    $('payee').innerHTML = fill(t.payee, { payee: esc(STORE.upi.payee) });
    $('l-upi').textContent = fill(t.upi, { amt: amt });
    $('upi-id').textContent = STORE.upi.id; $('code').textContent = order.code;
    // Demo stores show a QR that only holds text, so nobody can pay a made-up ID.
    var data = STORE.demo ? 'Thela demo store. This is not a payment QR.' : upiLink(order);
    var qr = qrcode(0, 'M'); qr.addData(data); qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: t.code + ' ' + order.code });
    $('save-qr').href = qr.createDataURL(8, 16);
    var apps = $('upi-apps');
    apps.hidden = !(STORE.upiAppButton || STORE.test) || STORE.demo || !(isAndroid || isIOS);
    $('l-apps').textContent = fill(t.app, { amt: amt });
    $('apps-row').innerHTML = APPS.map(function (a) { return '<a class="btn btn-primary" href="' + esc(appLink(a, order)) + '">' + esc(a.name) + '</a>'; }).join('') +
      '<a class="btn btn-secondary btn-other" href="' + esc(upiLink(order)) + '">' + esc(t.otherApp) + '</a>' +
      // Test pages only: the same apps without the amount filled in, to see which apps accept that.
      (STORE.test ? '<p class="apps-label" style="grid-column: 1 / -1; margin-top: 8px">Test: amount not filled in (type ' + esc(amt) + ' yourself)</p>' + APPS.map(function (a) { return '<a class="btn btn-secondary" href="' + esc(appLink(a, order, true)) + '">' + esc(a.name) + '</a>'; }).join('') : '');
    show(2); order.step = 2; order.at = order.at || Date.now(); save();
  }
  function message() {
    var p = STORE.products[order.i];
    return fill(p.monthly ? t.msgMonth : t.msg, { name: STORE.name.split(' ')[0], amt: rupees(p.price), item: p.title, code: order.code, buyer: order.buyer, email: order.email });
  }
  function toDone() {
    var wa = STORE.paidVia !== 'email', text = message();
    $('done-text').textContent = fill(wa ? t.doneWa : t.doneMail, { name: STORE.name.split(' ')[0], delivery: STORE.delivery });
    var link = wa ? 'https://wa.me/' + (STORE.demo ? '' : STORE.whatsapp) + '?text=' + encodeURIComponent(text)
                  : 'mailto:' + encodeURIComponent(STORE.email) + '?subject=' + encodeURIComponent('Order ' + order.code) + '&body=' + encodeURIComponent(text);
    $('send-msg').href = link; $('send-msg').textContent = wa ? t.sendWa : t.sendMail;
    $('done-small').innerHTML = esc(fill(t.doneSmall, { code: order.code })) + '<br><a href="' + esc(report(order.code)) + '" rel="noopener">' + esc(fill(t.notReceived, { delivery: STORE.delivery })) + '</a>';
    show(3); forget();
    return link;
  }

  document.querySelectorAll('.buy').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = Number(b.dataset.i), prev = load();
      open(prev && prev.i === i && prev.step >= 1 ? prev : { i: i, code: newCode(), step: 1 });
    });
  });
  $('step-1').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('b-email').value.trim();
    if (!$('b-name').value.trim()) { $('err').textContent = t.needName; $('b-name').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('err').textContent = t.needEmail; $('b-email').focus(); return; }
    var phone = $('b-phone').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
    if (CO && !/^[6-9]\d{9}$/.test(phone)) { $('err').textContent = t.needPhone; $('b-phone').focus(); return; }
    if (!$('b-age').checked) { $('err').textContent = t.needAge; $('b-age').focus(); return; }
    order.buyer = $('b-name').value.trim(); order.email = email;
    if (CO) { order.phone = phone; save(); payByCheckout(); } else toPay();
  });

  // Checkout: ask Thela's server for a Cashfree order at the store's price, then open Cashfree's page.
  function resetPay() {
    if (!CO || !order) return;
    $('to-pay').disabled = false;
    var p = STORE.products[order.i];
    $('to-pay').textContent = fill(t.payNow, { amt: rupees(p.price) + (p.monthly ? ' ' + t.perMonth : '') });
  }
  function loadSdk() {
    return new Promise(function (ok, fail) {
      if (window.Cashfree) return ok();
      var s = document.createElement('script');
      s.src = 'https://sdk.cashfree.com/js/v3/cashfree.js';
      var timer = setTimeout(function () { fail(new Error('sdk timeout')); }, 10000);
      s.onload = function () { clearTimeout(timer); window.Cashfree ? ok() : fail(new Error('sdk')); };
      s.onerror = function () { clearTimeout(timer); fail(new Error('sdk')); };
      document.head.appendChild(s);
    });
  }
  function payByCheckout() {
    var btn = $('to-pay');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = t.opening; $('err').textContent = '';
    var created;
    fetch('/.netlify/functions/create-order', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ store: STORE.slug, product: order.i, name: order.buyer, email: order.email, phone: order.phone })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(r.status === 400 ? 'form' : 'gateway');
        created = d;
      });
    }).then(function () {
      return loadSdk().catch(function () { throw new Error('sdk'); });
    }).then(function () {
      return window.Cashfree({ mode: created.mode }).checkout({ paymentSessionId: created.paymentSessionId, redirectTarget: '_self' });
    }).then(function (result) {
      // Cashfree reports a failed checkout as { error } rather than throwing.
      if (result && result.error) throw new Error('gateway');
    }).catch(function (e) {
      $('err').textContent = e.message === 'form' ? t.errForm : e.message === 'sdk' ? t.errSdk : t.errGateway;
      resetPay();
    });
  }
  // Coming back with the browser's Back button: the sheet is ready to pay again, details kept.
  window.addEventListener('pageshow', function (e) { if (e.persisted) resetPay(); });
  // Some in-app browsers block the clipboard. Only say "Copied" when it worked;
  // otherwise select the text so the buyer can press and hold to copy it.
  function copier(btn, target) {
    btn.addEventListener('click', function () {
      var text = target.textContent;
      var ok = function () { btn.textContent = t.copied; setTimeout(function () { btn.textContent = t.copy; }, 1800); };
      var manual = function () {
        var r = document.createRange(); r.selectNodeContents(target);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = t.holdToCopy; setTimeout(function () { btn.textContent = t.copy; }, 3000);
      };
      var legacy = function () {
        var a = document.createElement('textarea'); a.value = text; a.setAttribute('readonly', '');
        a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select();
        var done = false; try { done = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(a); done ? ok() : manual();
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, legacy); else legacy();
    });
  }
  copier($('copy-upi'), $('upi-id'));
  copier($('copy-code'), $('code'));
  $('paid').addEventListener('click', function () { var link = toDone(); window.open(link, '_blank', 'noopener'); });
  $('close').addEventListener('click', closeSheet);
  $('cancel-order').addEventListener('click', function () { forget(); order = null; closeSheet(); });
  $('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  // Came back after paying in the UPI app: reopen where the buyer left off.
  var pending = load();
  if (pending && pending.step >= 2 && STORE.products[pending.i]) open(pending);
})();
</script>
</body>
</html>
